<text x="70" y="482" font-family="Arial" font-size="40" font-weight="400">PuntoRecoleccion</text>
<rect x="935" y="430" width="850" height="145" fill="white" stroke="#444" stroke-width="3"/>
<text x="950" y="482" font-family="Arial" font-size="40" font-weight="400">RegistroResiduo</text>
<rect x="1815" y="430" width="850" height="145" fill="white" stroke="#444" stroke-width="3"/>
<text x="1830" y="482" font-family="Arial" font-size="40" font-weight="400">BitacoraService</text>
<text x="55" y="689" font-family="Arial" font-size="42" font-weight="700">Las láminas siguientes amplían los mensajes en orden. Guardas modeladas:</text>
<text x="55" y="772" font-family="Arial" font-size="40" font-weight="400">1. break: operario no asignado a la jornada</text>
<text x="55" y="847" font-family="Arial" font-size="40" font-weight="400">2. break: estado distinto de EN_EJECUCION</text>
<text x="55" y="922" font-family="Arial" font-size="40" font-weight="400">3. break: punto fuera de la ruta</text>
<text x="55" y="997" font-family="Arial" font-size="40" font-weight="400">4. break: sin generación y con detalle</text>
<text x="55" y="1072" font-family="Arial" font-size="40" font-weight="400">5. break: con generación y sin detalle</text>
<text x="55" y="1147" font-family="Arial" font-size="40" font-weight="400">6. break: kg &gt; capacidad x tolerancia</text>
<text x="55" y="1222" font-family="Arial" font-size="40" font-weight="400">7. break: litros &gt; capacidad x tolerancia</text>
<text x="55" y="1482" font-family="Arial" font-size="40" font-weight="400">Los participantes son responsabilidades de diseño; no nuevas clases de Python.</text>
<text x="55" y="1562" font-family="Arial" font-size="40" font-weight="400">El grafo posterior conserva la correspondencia entre nodos y números de mensaje.</text>
</svg>