<text x="950" y="162" font-family="Arial" font-size="40" font-weight="400">CampoView</text>
<rect x="1815" y="110" width="850" height="145" fill="white" stroke="#444" stroke-width="3"/>
<text x="1830" y="162" font-family="Arial" font-size="40" font-weight="400">JornadaController</text>
<rect x="55" y="270" width="850" height="145" fill="white" stroke="#444" stroke-width="3"/>
<text x="70" y="322" font-family="Arial" font-size="40" font-weight="400">VisitaService</text>
<rect x="935" y="270" width="850" height="145" fill="white" stroke="#444" stroke-width="3"/>
<text x="950" y="322" font-family="Arial" font-size="40" font-weight="400">Jornada</text>
