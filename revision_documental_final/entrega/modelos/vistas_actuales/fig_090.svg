<text x="55" y="764" font-family="Arial" font-size="42" font-weight="700">A/V/C son responsabilidades de análisis; E identifica cada entidad o control referido.</text>
<text x="55" y="837" font-family="Arial" font-size="40" font-weight="400">1. A → V: ejecutarETL()</text>
<text x="55" y="932" font-family="Arial" font-size="40" font-weight="400">1.1. V → C: ejecutar()</text>
<text x="55" y="1027" font-family="Arial" font-size="40" font-weight="400">1.2. C → E1: iniciar(usuario)</text>
<text x="55" y="1122" font-family="Arial" font-size="40" font-weight="400">1.3. C → E2: pendientes()</text>
<text x="55" y="1217" font-family="Arial" font-size="40" font-weight="400">1.4. C → E3: factores()</text>
<text x="1395" y="837" font-family="Arial" font-size="40" font-weight="400">1.5. C → E4: find()</text>
<text x="1395" y="932" font-family="Arial" font-size="40" font-weight="400">1.6. C → E5: cargar(df)</text>
<text x="1395" y="1027" font-family="Arial" font-size="40" font-weight="400">1.7. C → E6: create(motivo)</text>
<text x="1395" y="1122" font-family="Arial" font-size="40" font-weight="400">1.8. C → E1: finalizar(conteos)</text>
<text x="1395" y="1217" font-family="Arial" font-size="40" font-weight="400">1.9. C → E7: registrar(ETL)</text>
