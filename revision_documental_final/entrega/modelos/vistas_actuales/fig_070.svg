<text x="1150" y="1227" font-family="Arial" font-size="40" font-weight="400">8. Administración de la Plataforma y Auditoría</text>
<text x="55" y="1357" font-family="Arial" font-size="40" font-weight="400">Fila = paquete que usa; columna = paquete utilizado. 1 indica dependencia.</text>
<text x="55" y="1437" font-family="Arial" font-size="40" font-weight="400">Seguridad y administración son transversales; no representan fases de ejecución.</text>
<text x="55" y="1517" font-family="Arial" font-size="40" font-weight="400">Se conserva el modelo de análisis; las dependencias de archivos se detallan en componentes.</text>
