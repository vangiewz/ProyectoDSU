<text x="70" y="642" font-family="Arial" font-size="40" font-weight="400">RecomendacionService</text>
<text x="55" y="849" font-family="Arial" font-size="42" font-weight="700">Las láminas siguientes amplían los mensajes en orden. Guardas modeladas:</text>
<text x="55" y="932" font-family="Arial" font-size="40" font-weight="400">1. break: horizonte fuera de 1..máximo</text>
<text x="55" y="1007" font-family="Arial" font-size="40" font-weight="400">2. break: sin modelo publicado</text>
<text x="55" y="1082" font-family="Arial" font-size="40" font-weight="400">3. break: alcance sin permiso territorial</text>
<text x="55" y="1157" font-family="Arial" font-size="40" font-weight="400">4. opt: se indicó un sector</text>
<text x="55" y="1232" font-family="Arial" font-size="40" font-weight="400">5. opt: se indicó un punto</text>
<text x="55" y="1307" font-family="Arial" font-size="40" font-weight="400">6. break: ningún punto activo</text>
<text x="55" y="1382" font-family="Arial" font-size="40" font-weight="400">7. break: historial vacío</text>
<text x="55" y="1457" font-family="Arial" font-size="40" font-weight="400">8. break: ninguna fecha de recolección</text>
<text x="55" y="1717" font-family="Arial" font-size="40" font-weight="400">Los participantes son responsabilidades de diseño; no nuevas clases de Python.</text>
<text x="55" y="1797" font-family="Arial" font-size="40" font-weight="400">El grafo posterior conserva la correspondencia entre nodos y números de mensaje.</text>
</svg>