<text x="55" y="649" font-family="Arial" font-size="42" font-weight="700">A/V/C son responsabilidades de análisis; E identifica cada entidad o control referido.</text>
<text x="55" y="722" font-family="Arial" font-size="40" font-weight="400">1. A → V: consultar(filtros)</text>
<text x="55" y="817" font-family="Arial" font-size="40" font-weight="400">1.1. V → C: findAll(filtros)</text>
<text x="55" y="912" font-family="Arial" font-size="40" font-weight="400">1.2. C → E1: find(filtros)</text>
<text x="1395" y="722" font-family="Arial" font-size="40" font-weight="400">2. A → V: verDetalle(id)</text>
