<text x="55" y="649" font-family="Arial" font-size="42" font-weight="700">A/V/C son responsabilidades de análisis; E identifica cada entidad o control referido.</text>
<text x="55" y="722" font-family="Arial" font-size="40" font-weight="400">1. A → V: verRuta()</text>
<text x="55" y="817" font-family="Arial" font-size="40" font-weight="400">1.1. V → C: siguientePunto(jornada)</text>
<text x="55" y="912" font-family="Arial" font-size="40" font-weight="400">1.2. C → E1: find(id)</text>
<text x="55" y="1007" font-family="Arial" font-size="40" font-weight="400">1.3. C → E2: siguientePendiente()</text>
<text x="55" y="1102" font-family="Arial" font-size="40" font-weight="400">2. A → V: registrarVaciado(detalles)</text>
<text x="1395" y="722" font-family="Arial" font-size="40" font-weight="400">2.1. V → C: registrarVisita(jornada, punto, detalles)</text>
<text x="1395" y="817" font-family="Arial" font-size="40" font-weight="400">2.2. C → E1: exigirEnEjecucion()</text>
<text x="1395" y="912" font-family="Arial" font-size="40" font-weight="400">2.3. C → E3: capacidad()</text>
<text x="1395" y="1007" font-family="Arial" font-size="40" font-weight="400">2.4. C → E4: create(detalle)</text>
<text x="1395" y="1102" font-family="Arial" font-size="40" font-weight="400">2.5. C → E2: marcarVisitado()</text>
