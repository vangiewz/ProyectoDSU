<text x="55" y="679" font-family="Arial" font-size="42" font-weight="700">A/V/C son responsabilidades de análisis; E identifica cada entidad o control referido.</text>
<text x="55" y="752" font-family="Arial" font-size="40" font-weight="400">1. A → V: nuevaJornada(fecha, turno, sector)</text>
<text x="55" y="847" font-family="Arial" font-size="40" font-weight="400">1.1. V → C: puntosPropuestos(sector)</text>
<text x="55" y="942" font-family="Arial" font-size="40" font-weight="400">1.2. C → E1: find(sector)</text>
<text x="55" y="1037" font-family="Arial" font-size="40" font-weight="400">1.3. C → E2: aceptadas(sector)</text>
<text x="55" y="1132" font-family="Arial" font-size="40" font-weight="400">2. A → V: guardar(datos, ruta)</text>
<text x="55" y="1227" font-family="Arial" font-size="40" font-weight="400">2.1. V → C: create(dto)</text>
<text x="55" y="1322" font-family="Arial" font-size="40" font-weight="400">2.2. C → E3: create(dto)</text>
<text x="55" y="1417" font-family="Arial" font-size="40" font-weight="400">2.3. C → E4: create(orden)</text>
<text x="1395" y="752" font-family="Arial" font-size="40" font-weight="400">3. A → V: asignar(personal, vehiculos)</text>
<text x="1395" y="847" font-family="Arial" font-size="40" font-weight="400">3.1. V → C: asignar(id, recursos)</text>
<text x="1395" y="942" font-family="Arial" font-size="40" font-weight="400">3.2. C → E5: asignar()</text>
<text x="1395" y="1037" font-family="Arial" font-size="40" font-weight="400">4. A → V: confirmar(id)</text>
<text x="1395" y="1132" font-family="Arial" font-size="40" font-weight="400">4.1. V → C: confirmar(id)</text>
<text x="1395" y="1227" font-family="Arial" font-size="40" font-weight="400">4.2. C → E3: setEstado(CONFIRMADA)</text>
<text x="1395" y="1322" font-family="Arial" font-size="40" font-weight="400">4.3. C → E6: registrar(MODIFICACION)</text>
</svg>