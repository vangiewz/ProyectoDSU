# Integración y despliegue continuos del sistema DSU / Residata.
# CI en pushes a main/cierre-software2-20261118 y pull requests; CD a la VM de Azure solo desde main y con los secrets configurados.
name: CI/CD

on:
  push:
    branches: [main, cierre-software2-20261118]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ruff + pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gestion-residuos-dsu/backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dsu
          POSTGRES_PASSWORD: dsu
          POSTGRES_DB: dsu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dsu" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-solo-pruebas
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      DATABASE_URL: postgres://dsu:dsu@localhost:5432/dsu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gestion-residuos-dsu/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-backend
          path: gestion-residuos-dsu/backend/pytest.xml

  frontend:
    name: Frontend (oxlint + tsc + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gestion-residuos-dsu/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gestion-residuos-dsu/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  sitio:
    name: Sitio corporativo (ensamblado)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensamblar y comprobar que no hay cambios sin generar
        working-directory: sitio-residata
        run: |
          node probar_salud.cjs
          python construir.py
          git diff --exit-code -- '*.html' feed.xml

  desplegar-api:
    name: Desplegar API en Azure VM
    needs: [backend, frontend, sitio]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: produccion
    permissions:
      contents: read
      id-token: write
    env:
      HOST: ${{ secrets.AZURE_VM_HOST }}
      NSG_RULE: gha-dsu-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuración de producción
        env:
          CLAVE: ${{ secrets.AZURE_VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          for value in "$HOST" "$CLAVE" "$KNOWN_HOSTS" "$CLIENT_ID" "$TENANT_ID" "$SUBSCRIPTION_ID"; do
            if [ -z "$value" ]; then
              echo "::error::Falta un secret del entorno produccion. No se desplegó la API."
              exit 1
            fi
          done
      - name: Autenticar en Azure mediante OIDC
        id: azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Autorizar temporalmente la IP del ejecutor
        id: red
        run: |
          RUNNER_IP=$(curl -4 -fsS --retry 3 https://api.ipify.org)
          python3 -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$RUNNER_IP"
          az network nsg rule create --resource-group residata-dsu-rg --nsg-name dsu-apiNSG \
            --name "$NSG_RULE" --priority 1100 --direction Inbound --access Allow --protocol Tcp \
            --source-address-prefixes "$RUNNER_IP/32" --source-port-ranges '*' \
            --destination-address-prefixes '*' --destination-port-ranges 22 \
            --description "Acceso temporal de GitHub Actions al desplegar DSU" --output none
      - name: Copiar el backend y reconstruir la imagen de producción
        env:
          CLAVE: ${{ secrets.AZURE_VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$CLAVE" > "$RUNNER_TEMP/dsu_ci_key"
          chmod 600 "$RUNNER_TEMP/dsu_ci_key" ~/.ssh/known_hosts
          conectado=no
          for intento in $(seq 1 12); do
            if ssh -i "$RUNNER_TEMP/dsu_ci_key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=5 azureuser@"$HOST" true; then
              conectado=si
              break
            fi
            sleep 5
          done
          [ "$conectado" = si ] || { echo "::error::No se pudo conectar a la VM por SSH."; exit 1; }
          tar --exclude=.env --exclude=respaldos -czf backend.tgz -C gestion-residuos-dsu/backend .
          scp -i "$RUNNER_TEMP/dsu_ci_key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 backend.tgz azureuser@"$HOST":~/dsu/backend.tgz
          ssh -i "$RUNNER_TEMP/dsu_ci_key" -o IdentitiesOnly=yes -o BatchMode=yes azureuser@"$HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          revision="$1"
          cd "$HOME/dsu/backend"
          tar xzf ../backend.tgz
          cd deploy
          export APP_REVISION="$revision"
          docker compose --env-file ../.env -f compose.azure.yml up -d --build --no-deps app
          container=$(docker compose --env-file ../.env -f compose.azure.yml ps -q app)
          actual=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$container")
          [ "$actual" = "$revision" ]
          printf '%s\n' "$actual" > "$HOME/dsu/DEPLOYED_REVISION"
          printf 'API_IMAGE_REVISION=%s\n' "$actual"
          REMOTE
      - name: Verificar que la API desplegada responde
        run: |
          for intento in $(seq 1 18); do
            code=$(curl --max-time 10 -s -o /dev/null -w '%{http_code}' https://dsu-uagrm-api.mexicocentral.cloudapp.azure.com/api/auth/me/ || true)
            if [ "$code" = 401 ]; then
              echo "API Azure desplegada y verificada: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::La API no devolvió el 401 esperado sin autenticación."
          exit 1
      - name: Retirar el acceso temporal de red
        if: always() && steps.azure.outcome == 'success' && steps.red.outcome != 'skipped'
        run: |
          az network nsg rule delete --resource-group residata-dsu-rg --nsg-name dsu-apiNSG --name "$NSG_RULE"
      - name: Retirar la clave temporal del ejecutor
        if: always()
        run: rm -f "$RUNNER_TEMP/dsu_ci_key"
